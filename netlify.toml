[build]
  publish = "techpulse/packages/mobile/dist"
  command = "npm install && cd techpulse/packages/mobile && npm install && EXPO_PUBLIC_WISH_API=/api npx expo export --platform web --output-dir dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["techpulse/packages/shared/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
